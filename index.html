<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSGame</title>
    <script>
      // Игра всегда живёт на localhost: там её прогресс. Адрес 127.0.0.1
      // (его печатает Vite) остаётся песочнице.
      if (location.hostname === `127.0.0.1`) {
        location.replace(location.href.replace(`//127.0.0.1`, `//localhost`));
      }
    </script>
  </head>
  <body>
    <div id="frame">
      <div id="sandbox" class="sandbox"></div>
      <div id="preview" class="sandbox"></div>
      <canvas id="scene" width="320" height="180"></canvas>
      <div id="nameplate" class="place mono plate"></div>
      <div id="shownote" class="place mono plate" hidden>
        показано медленно то, что случилось мгновенно
      </div>
      <div id="slowplate" class="place mono plate">Shift+Ctrl+Enter</div>
      <div id="alignplate" class="place mono plate">Shift+Alt+F</div>
      <div id="caption" class="place mono plate"></div>
      <div id="settings" class="mono" hidden></div>
      <div id="code" class="place"></div>
      <div id="notes" class="place mono"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
